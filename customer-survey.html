<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Customer Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        form {
            width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            color: #666;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            height: 80px;
        }

        .radio label,
        .checkbox label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 9px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form>
    <h1>Customer Survey</h1>

    <p>Please complete the following survey.</p>

    <div class="field">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
    </div>

    <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </div>

    <div class="field">
        <label>How did you hear about us?</label>
        <select name="source">
            <option value="">-- Please select --</option>
            <option value="friend">Friend</option>
            <option value="internet">Internet</option>
            <option value="advertisement">Advertisement</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="field radio">
        <label>How satisfied are you with our service?</label>
        <input type="radio" name="satisfaction" value="very-good"> Very satisfied
        <input type="radio" name="satisfaction" value="good"> Satisfied
        <input type="radio" name="satisfaction" value="normal"> Normal
        <input type="radio" name="satisfaction" value="bad"> Dissatisfied
    </div>

    <div class="field checkbox">
        <label>Which products do you use?</label>
        <input type="checkbox" name="product" value="product1"> Product 1
        <input type="checkbox" name="product" value="product2"> Product 2
        <input type="checkbox" name="product" value="product3"> Product 3
    </div>

    <div class="field">
        <label for="comment">Additional comments:</label>
        <textarea id="comment" name="comment"></textarea>
    </div>

    <div class="buttons">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>
</form>

</body>
</html>

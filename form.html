<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form đăng ký học viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        form {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"] {
            width: 220px;
            padding: 6px;
        }

        .hobby {
            margin-left: 120px;
            margin-bottom: 15px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form>
    <h2>ĐĂNG KÝ HỌC VIÊN</h2>

    <label for="yourname">Họ và tên:</label>
    <input type="text" id="yourname" name="yourname"><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br>

    <label>Sở thích:</label>
    <div class="hobby">
        <input type="checkbox" name="hobby" value="sport"> Thể thao<br>
        <input type="checkbox" name="hobby" value="music"> Âm nhạc<br>
        <input type="checkbox" name="hobby" value="reading"> Đọc sách
    </div>

    <label for="phone">Số điện thoại:</label>
    <input type="tel" id="phone" name="phone"><br>

    <label for="birthday">Ngày sinh:</label>
    <input type="date" id="birthday" name="birthday"><br>

    <div class="buttons">
        <input type="submit" value="Gửi thông tin">
        <input type="reset" value="Nhập lại">
    </div>
</form>

</body>
</html>
